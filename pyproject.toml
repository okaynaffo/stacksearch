[project]
name = "stacksearch"
version = "0.1.0"
description = "Private, local-first personal search engine (PLAN.md)"
readme = "README.md"
requires-python = ">=3.12"

# Core runtime, Phases 0-4.
#
# HARD CONSTRAINT (PLAN.md section 4.1 / section 16): torch must never appear in this
# venv. ONNX-only via fastembed. scripts/check_no_torch.py enforces it in CI.
dependencies = [
    # API layer (PLAN.md section 10)
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sse-starlette==3.5.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "httpx==0.28.1",
    "python-multipart==0.0.32",
    # Storage (PLAN.md section 5)
    "sqlite-vec==0.1.9",
    # Models: embeddings + reranking, ONNX only (PLAN.md section 4.1)
    "fastembed==0.8.1",
    "onnxruntime==1.30.0",
    # fastembed 0.8.1 requires huggingface-hub>=0.20,<2.0, so 2.x is not an option.
    "huggingface-hub==1.33.0",
    "numpy==2.3.4",
    # Extraction / connectors for Phases 1 and 3 (PLAN.md section 6.2, 6.3)
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "watchdog==6.0.0",
    # Query understanding (PLAN.md section 7.1)
    "dateparser==1.4.3",
]

# Phase 5 connectors (PLAN.md section 6.2). Pinned here from day one so there is no
# dependency churn mid-semester, but kept out of the default venv until Phase 5 needs
# them: install with `uv sync --extra phase5`.
[project.optional-dependencies]
phase5 = [
    "imapclient==4.1.0",
    "mail-parser==4.8.0",
    "trafilatura==2.3.1",
    "tree-sitter-language-pack==1.21.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no I/O beyond a temp dir",
    "integration: exercises the filesystem index end to end",
    "perf: latency and memory measurements (PLAN.md §14.2)",
    "privacy: asserts nothing escapes the machine (PLAN.md §15)",
    "slow: needs downloaded models or a running llama-server",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]